x-service-env: &service-env
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  EUREKA_URL: http://discovery:8761/eureka
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    ports: [ "5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: [ "9092:9092" ]   # EXTERNAL : services lancés depuis l'IDE (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # CONTROLLER lié au nom du service : Kafka 3.9 refuse d'annoncer un contrôleur en 0.0.0.0
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list" ]
      interval: 10s
      retries: 10

  discovery:
    build: { context: ./backend, args: { MODULE: discovery-service } }
    ports: [ "8761:8761" ]

  gateway:
    build: { context: ./backend, args: { MODULE: api-gateway } }
    ports: [ "${GATEWAY_PORT:-8080}:8080" ]
    environment:
      EUREKA_URL: http://discovery:8761/eureka
    depends_on: [ discovery ]

  auth:
    build: { context: ./backend, args: { MODULE: auth-service } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
    depends_on:
      postgres: { condition: service_healthy }
      discovery: { condition: service_started }

  catalog:
    build: { context: ./backend, args: { MODULE: catalog-service } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery: { condition: service_started }

  supplier:
    build: { context: ./backend, args: { MODULE: supplier-service } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supplier_db
    depends_on:
      postgres: { condition: service_healthy }
      discovery: { condition: service_started }

  frontend:
    build: ./frontend
    ports: [ "${FRONTEND_PORT:-4200}:80" ]
    depends_on: [ gateway ]

  # Lots suivants : sales, reporting (même modèle que auth).

volumes:
  pgdata:
