server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: catalog_user
    password: ${DB_PASSWORD:store}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        # broker absent : l'OutboxRelay échoue vite et réessaie au cycle suivant (au lieu de bloquer 60 s)
        max.block.ms: 10000
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
  data:
    web:
      pageable:
        max-page-size: 100

app:
  security:
    jwt-secret: ${JWT_SECRET}
    # exigé sur /internal/** (InternalApiFilter) et envoyé par les clients Feign ; vide = /internal/** refusé
    internal-secret: ${INTERNAL_SECRET:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
