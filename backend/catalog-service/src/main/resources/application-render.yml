# Profil « render » : pas d'Eureka ; catalog appelle supplier-service par son URL (SUPPLIER_URL, cf. render.yaml).
eureka:
  client:
    enabled: false

spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            supplier-service:
              - uri: ${SUPPLIER_URL}
    openfeign:
      client:
        config:
          default:
            # service gratuit endormi : 1 à 3 min de réveil
            connect-timeout: 10000
            read-timeout: 180000
