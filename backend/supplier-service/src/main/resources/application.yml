server:
  port: ${PORT:8083}   # Render impose son port via PORT

spring:
  application:
    name: supplier-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/supplier_db}
    username: supplier_user
    password: ${DB_PASSWORD:store}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt-secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
