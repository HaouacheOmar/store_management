# Profil « render » : pas d'Eureka ; sales appelle catalog-service par son URL (CATALOG_URL, cf. render.yaml).
eureka:
  client:
    enabled: false

spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            catalog-service:
              - uri: ${CATALOG_URL}
    openfeign:
      client:
        config:
          default:
            # service gratuit endormi : 1 à 3 min de réveil
            connect-timeout: 10000
            read-timeout: 180000
