server:
  port: ${PORT:8081}   # Render impose son port via PORT

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: auth_user
    password: ${DB_PASSWORD:store}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt-secret: ${JWT_SECRET}
    public-paths: /auth/register,/auth/login
  jwt-ttl: 8h

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
