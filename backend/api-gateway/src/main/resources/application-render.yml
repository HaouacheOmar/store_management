# Profil « render » (SPRING_PROFILES_ACTIVE=render) : pas d'Eureka, adresses fixes.
# Offre gratuite Render : les services ne reçoivent pas le trafic privé, on les appelle par leur URL publique
# (*_URL, ex. https://store-auth.onrender.com). Leurs routes restent protégées (JWT, secret de service).
eureka:
  client:
    enabled: false

spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_URL}
            catalog-service:
              - uri: ${CATALOG_URL}
            supplier-service:
              - uri: ${SUPPLIER_URL}
            sales-service:
              - uri: ${SALES_URL}
            reporting-service:
              - uri: ${REPORTING_URL}
    gateway:
      server:
        webflux:
          httpclient:
            # un service gratuit endormi met 1 à 3 min à se réveiller : on l'attend au lieu de répondre 504
            connect-timeout: 10000
            response-timeout: 180s
