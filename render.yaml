# Render Blueprint — offre GRATUITE (sans carte) : 6 services web gratuits, sans Eureka.
# Base de données : Neon (une base par service). Kafka : fournisseur externe (SASL/SSL).
# Voir DEPLOYMENT.md. Les valeurs « sync: false » sont demandées dans le tableau de bord à la création.
#
# Contraintes de l'offre gratuite (cf. DEPLOYMENT.md) :
#  - pas de réseau privé entrant : les services s'appellent par URL publique (groupe store-urls) ;
#  - mise en veille après 15 min sans trafic, réveil en 1 à 3 min (WakeUpPinger dans la gateway) ;
#  - 750 h d'instance par mois, partagées par les 6 services.

envVarGroups:
  # partagé par tous les services backend
  - name: store-common
    envVars:
      - key: JWT_SECRET            # identique partout : généré une fois par Render
        generateValue: true
      - key: INTERNAL_SECRET       # secret service → service des routes /internal/**
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: "10000"
      # 512 Mo / CPU partagé : démarrage rapide (JIT C1 seul), petit GC, pile réduite
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
      # peu de connexions par service (Neon), aucune connexion gardée au repos
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      # Kafka managé (cf. DEPLOYMENT.md §2)
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
        sync: false
      - key: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
        sync: false
      # Aiven signe ses certificats avec sa propre CA (onglet « CA certificate » du service) : on la fait confiance
      - key: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE
        value: PEM
      - key: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_CERTIFICATES
        sync: false

  # URL publiques des services (offre gratuite : pas de réseau privé entrant).
  # Si Render ajoute un suffixe au nom (nom déjà pris), corrigez ces valeurs après la création.
  - name: store-urls
    envVars:
      - key: AUTH_URL
        value: https://store-auth.onrender.com
      - key: CATALOG_URL
        value: https://store-catalog.onrender.com
      - key: SUPPLIER_URL
        value: https://store-supplier.onrender.com
      - key: SALES_URL
        value: https://store-sales.onrender.com
      - key: REPORTING_URL
        value: https://store-reporting.onrender.com

services:
  - type: web
    name: store-gateway
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths: [ backend/** ]
    envVars:
      - fromGroup: store-common
      - fromGroup: store-urls
      - key: MODULE                # argument de build du Dockerfile
        value: api-gateway

  - type: web
    name: store-auth
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths: [ backend/** ]
    envVars:
      - fromGroup: store-common
      - key: MODULE
        value: auth-service
      - key: SPRING_DATASOURCE_URL       # jdbc:postgresql://<hôte Neon>/auth_db?sslmode=require
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: auth_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: store-catalog
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths: [ backend/** ]
    envVars:
      - fromGroup: store-common
      - fromGroup: store-urls
      - key: MODULE
        value: catalog-service
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: catalog_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: store-supplier
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths: [ backend/** ]
    envVars:
      - fromGroup: store-common
      - key: MODULE
        value: supplier-service
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: supplier_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: store-sales
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths: [ backend/** ]
    envVars:
      - fromGroup: store-common
      - fromGroup: store-urls
      - key: MODULE
        value: sales-service
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: sales_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: store-reporting
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths: [ backend/** ]
    envVars:
      - fromGroup: store-common
      - key: MODULE
        value: reporting-service
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: reporting_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
