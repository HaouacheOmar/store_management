server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS interne de Docker, interrogé à nouveau toutes les 10 s : avec une cible en variable, nginx
    # suit la nouvelle IP de la gateway quand son conteneur est recréé (sinon 502 jusqu'au redémarrage de nginx)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    # même origine que le front : pas de CORS
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    # /ws exactement (point d'entrée STOMP), pas seulement /ws/…
    location /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA : toute autre route sert index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
